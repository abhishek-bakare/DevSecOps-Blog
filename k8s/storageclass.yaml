apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jerney-ebs-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
#keeps the storage resource and PV object intact after PVc is deleted
reclaimPolicy: Retain
#first see in which node pod is there, if pod requests the pvc then it will go to in the correct node with correct pod
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
