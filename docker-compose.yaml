services:
  db:
    image: postgres:16-alpine
    container_name: jerney-db
    # restart container if stopped
    restart: unless-stopped
    environment:
      # .env
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U jerney_user -d jerney_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    #temp filesystem for system processes, when container stops the data also gone
    tmpfs:
      - /tmp
      - /run
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jerney_backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME} 
    expose:
      - "5000"
    depends_on: 
      db:
        condition: service_healthy
    #no priviledges required just use whatever are in dockerfile    
    security_opt:
      - no-new-privileges:true
    #no process can write, modift, delete on fs
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jerney_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    
volumes:  
  pgdata:
    driver: local